name: kp-builder

services:
  prisma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kp-builder-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${KP_BUILDER_HOST_PORT:-3005}:3000"
    volumes:
      - kp-builder-data:/app/.data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kp-builder-data:
    name: kp-builder-data

networks:
  default:
    name: kp-builder-net
